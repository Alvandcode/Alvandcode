name: Update working-on (every 3 days)

on:
  schedule:
    # Every 3 days at 06:00 UTC -> days 1,4,7,10,13,16,19,22,25,28
    - cron: "0 6 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update currently working on from latest pushed repos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = 'Alvandcode';

            // Get repos sorted by push date, exclude profile repo itself
            const { data: repos } = await github.rest.repos.listForUser({
              username: owner,
              sort: 'pushed',
              direction: 'desc',
              per_page: 20
            });

            const active = repos
              .filter(r => !r.fork && r.name.toLowerCase() !== owner.toLowerCase())
              .slice(0, 2);

            if (active.length === 0) {
              core.info('No active repos found');
              return;
            }

            const fmtEN = (r) => `**${r.name}${r.language ? ` (${r.language})` : ''}**`;
            const faLang = { 'Kotlin': 'کاتلین', 'Python': 'پایتون', 'Dart': 'دارت', 'JavaScript': 'جاوااسکریپت', 'Java': 'جاوا', 'HTML': 'اچ‌تی‌ام‌ال', 'Dockerfile': 'داکر' };
            const fmtFA = (r) => `**${r.name}${r.language ? ` (${faLang[r.language] || r.language})` : ''}**`;

            const en = active.map(fmtEN).join(' and ');
            const fa = active.map(fmtFA).join(' و ');

            let readme = fs.readFileSync('README.md', 'utf8');
            const orig = readme;

            readme = readme.replace(
              /(<!-- WORKING-ON:START -->)(.*?)(<!-- WORKING-ON:END -->)/s,
              `$1${en}$3`
            );
            readme = readme.replace(
              /(<!-- WORKING-ON-FA:START -->)(.*?)(<!-- WORKING-ON-FA:END -->)/s,
              `$1${fa}$3`
            );

            if (readme !== orig) {
              fs.writeFileSync('README.md', readme);
              core.info('README updated: ' + en);
            } else {
              core.info('No change');
            }

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update currently working on (every 3 days)"
            git push
          fi
